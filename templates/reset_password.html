{% extends 'auth_base.html' %}
{% block title %}Yeni şifre belirle{% endblock %}

{% block content %}
<h1>Yeni şifre belirle</h1>
<p class="lead-sm">En az 6 karakterlik yeni bir şifre seç.</p>

{% if error %}
<div class="alert alert-danger d-flex gap-2" role="alert"><i class="bi bi-exclamation-circle"></i><span>{{ error }}</span></div>
{% endif %}

<form method="POST" action="{{ url_for('reset_password', token=token) }}" id="resetForm" novalidate>
    <div class="mb-3">
        <label class="form-label" for="password">Yeni şifre</label>
        <div class="pw-field">
            <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="6" required>
            <button type="button" class="pw-toggle" data-target="password" aria-label="Şifreyi göster"><i class="bi bi-eye"></i></button>
        </div>
    </div>
    <div class="mb-4">
        <label class="form-label" for="password_confirm">Yeni şifre tekrar</label>
        <input type="password" class="form-control" id="password_confirm" name="password_confirm" autocomplete="new-password" required aria-describedby="confirmErr">
        <div class="invalid-feedback" id="confirmErr">İki şifre aynı olmalı.</div>
    </div>
    <button type="submit" class="btn btn-primary">Şifreyi kaydet</button>
</form>

<p class="auth__alt"><a href="{{ url_for('login') }}">Giriş sayfasına dön</a></p>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('resetForm').addEventListener('submit', function (e) {
        var pw = document.getElementById('password');
        var confirm = document.getElementById('password_confirm');
        var ok = pw.value === confirm.value;
        confirm.classList.toggle('is-invalid', !ok);
        confirm.setAttribute('aria-invalid', String(!ok));
        if (!ok || !this.checkValidity()) {
            e.preventDefault();
            this.classList.add('was-validated');
            (ok ? this.querySelector(':invalid') : confirm).focus();
        }
    });
</script>
{% endblock %}
